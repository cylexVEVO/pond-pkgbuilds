name: Build custom Pond image
on:
  workflow_dispatch:
    inputs:
      version:
        description: ISO version (X.Y.Z)
        required: true
        type: string
      installer_ref:
        description: cylexVEVO/iso-installer commit or branch
        default: custom-pond
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: custom-pond-release
  cancel-in-progress: false
jobs:
  packages:
    runs-on: ubuntu-latest
    container:
      image: archlinux@sha256:732829e182d0cb7ef3d799827e799ff3bdd2d27fee557770bbd611a211439cf6
      options: --init
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: custom/scripts/configure-builder.sh
      - run: custom/tests/repository-priority.sh
      - run: custom/scripts/build-packages.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: custom-packages
          path: out/packages/
          overwrite: true
          retention-days: 7
  repository:
    needs: packages
    runs-on: ubuntu-latest
    container:
      image: archlinux@sha256:732829e182d0cb7ef3d799827e799ff3bdd2d27fee557770bbd611a211439cf6
      options: --init
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: pacman -Syu --needed --noconfirm github-cli
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: custom-packages
          path: out/packages
      - name: Import dedicated signing key
        env:
          SIGNING_KEY: ${{ secrets.POND_SIGNING_KEY }}
        run: |
          install -d -m700 /tmp/pond-signing
          printf '%s' "$SIGNING_KEY" | gpg --homedir /tmp/pond-signing --batch --import
      - run: custom/scripts/sign-repository.sh
        env:
          GNUPGHOME: /tmp/pond-signing
      - run: custom/scripts/publish-repository.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - if: always()
        run: rm -rf /tmp/pond-signing
  rootfs:
    needs: repository
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
    runs-on: ubuntu-latest
    container:
      image: archlinux@sha256:732829e182d0cb7ef3d799827e799ff3bdd2d27fee557770bbd611a211439cf6
      options: --init --privileged
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: pacman -Syu --needed --noconfirm arch-install-scripts jq python github-cli
      - run: custom/scripts/build-rootfs.sh
        env:
          KEEP_UPSTREAM_DOWNLOAD: '0'
      - name: Reclaim extracted tree before splitting release assets
        run: rm -rf custom/work
      - name: Publish immutable rootfs release
        id: release
        run: |
          tag="rootfs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          custom/scripts/publish-rootfs.sh out/rootfs "$tag"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rootfs-manifest
          path: out/rootfs/rootfs.json
          overwrite: true
  iso:
    needs: rootfs
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container:
      image: archlinux@sha256:732829e182d0cb7ef3d799827e799ff3bdd2d27fee557770bbd611a211439cf6
      options: --init --privileged
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: cylexVEVO/iso-installer
          ref: ${{ inputs.installer_ref }}
          persist-credentials: false
      - run: pacman -Syu --needed --noconfirm archiso grub git make python github-cli
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rootfs-manifest
          path: rootfs-manifest
      - run: python scripts/use-rootfs.py rootfs-manifest/rootfs.json
      - run: make check
      - run: make iso VERSION="$ISO_VERSION"
        env:
          ISO_VERSION: ${{ inputs.version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: custom-pond-iso
          path: out/
          overwrite: true
          retention-days: 14
      - name: Publish ISO beside its rootfs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.rootfs.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" --repo "$RELEASE_REPO" out/*.iso out/*.sha256
